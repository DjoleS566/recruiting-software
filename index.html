<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kandidaten hinzufügen</title>
</head>
<body>
    <h1>Kandidaten hinzufügen</h1>
    <form id="candidateForm">
        <label for="firstname">Vorname:</label><br>
        <input type="text" id="firstname" name="firstname" required><br>

        <label for="lastname">Nachname:</label><br>
        <input type="text" id="lastname" name="lastname" required><br>
        
        <label for="dob">Geburtsdatum:</label><br>
        <input type="date" id="dob" name="dob" required><br>

        <label for="email">E-Mail:</label><br>
        <input type="email" id="email" name="email" required><br>
        
        <label for="phone">Telefonnummer:</label><br>
        <input type="text" id="phone" name="phone" required><br>

        <label for="address">Adresse:</label><br>
        <textarea id="address" name="address" required></textarea><br>

        <label for="nationality">Staatsangehörigkeit:</label><br>
        <input type="text" id="nationality" name="nationality" required><br>

        <label for="linkedin">LinkedIn Profil:</label><br>
        <input type="url" id="linkedin" name="linkedin"><br>

        <label for="portfolio">Portfolio-Website:</label><br>
        <input type="url" id="portfolio" name="portfolio"><br>

        <label for="experience">Berufserfahrung (z. B. Positionen, Unternehmen):</label><br>
        <textarea id="experience" name="experience" required></textarea><br>

        <label for="qualifications">Qualifikationen:</label><br>
        <textarea id="qualifications" name="qualifications" required></textarea><br>

        <label for="skills">Fähigkeiten:</label><br>
        <textarea id="skills" name="skills" required></textarea><br>

        <label for="languages">Sprachkenntnisse:</label><br>
        <input type="text" id="languages" name="languages"><br>

        <label for="availability">Verfügbarkeit:</label><br>
        <input type="text" id="availability" name="availability"><br>

        <label for="salaryExpectations">Gehaltserwartungen:</label><br>
        <input type="text" id="salaryExpectations" name="salaryExpectations"><br>

        <label for="cv">Lebenslauf (CV):</label><br>
        <input type="file" id="cv" name="cv" required><br>

        <label for="references">Referenzen:</label><br>
        <textarea id="references" name="references"></textarea><br>

        <label for="portfolioProjects">Projektportfolio:</label><br>
        <textarea id="portfolioProjects" name="portfolioProjects"></textarea><br>

        <label for="comments">Zusätzliche Anmerkungen:</label><br>
        <textarea id="comments" name="comments"></textarea><br>

        <label for="status">Status:</label><br>
        <select id="status" name="status" required>
            <option value="In Bearbeitung">In Bearbeitung</option>
            <option value="Akzeptiert">Akzeptiert</option>
            <option value="Abgelehnt">Abgelehnt</option>
        </select><br>

        <input type="submit" value="Kandidaten hinzufügen">
    </form>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $("#candidateForm").submit(function(event) {
            event.preventDefault();
            const formData = new FormData(this);

            // API-Aufruf zum Hinzufügen des Kandidaten
            fetch("https://deine-api-endpoint-hier", {
                method: "POST",
                body: formData,
            })
            .then(response => response.json())
            .then(data => alert("Kandidat hinzugefügt!"))
            .catch(error => console.error("Fehler beim Hinzufügen:", error));
        });
    </script>
</body>
</html>
